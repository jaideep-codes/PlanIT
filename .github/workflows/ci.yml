name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare environment files
        run: |
          cp apps/api/.env.example apps/api/.env
          cp apps/web/.env.example apps/web/.env.local

      # Same images and init scripts as local development (creates planit and planit_test).
      - name: Start PostgreSQL, Redis, and Mailpit
        run: docker compose up -d --wait

      - name: Apply migrations
        run: |
          pnpm db:migrate:deploy
          DATABASE_URL=postgresql://planit:planit_dev_password@127.0.0.1:5432/planit_test pnpm db:migrate:deploy

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          sudo install -m 0755 "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan tracked files for secrets
        run: |
          pnpm run scan:secrets
          gitleaks detect --source . --redact --no-banner --exit-code 1

      - name: Unit tests
        run: pnpm run test

      - name: API e2e tests
        run: pnpm run test:e2e

      - name: Install Playwright browser
        run: pnpm --filter @planit/web exec playwright install --with-deps chromium

      - name: Browser e2e tests
        run: pnpm run test:browser

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            apps/web/test-results
            apps/web/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Build
        run: pnpm build

      - name: Scan the production web client bundle
        run: pnpm run scan:secrets -- --require-bundle

      - name: Audit production dependencies
        run: pnpm audit --prod
        continue-on-error: true
